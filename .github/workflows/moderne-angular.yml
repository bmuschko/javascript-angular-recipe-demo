name: Moderne UpgradeToAngular21

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  recipe-verification:
    name: recipe-verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Homebrew (Linux)
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@master

      - name: Install Moderne CLI (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: brew install moderneinc/moderne/mod

      - name: Install Moderne CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install mod --prerelease -y

      - name: Set up mod-run helper
        shell: bash
        run: |
          BIN_DIR="$RUNNER_TEMP/moderne-bin"
          mkdir -p "$BIN_DIR"

          cat > "$BIN_DIR/mod-run" <<'EOF'
          #!/bin/bash
          set -o pipefail
          mod run "$@" 2>&1 | tee output.log
          # Strip carriage-return progress artifacts so overwritten status lines
          # (e.g. "Found 0 errors …") do not cause false-positive matches.
          sed $'s/.*\r//' output.log | sed 's/\x1b\[[0-9;]*m//g' > output_rendered.log
          if grep -qE "Found [0-9]+ errors while running the recipe\." output_rendered.log; then
            echo "::warning::Recipe execution reported errors (may be bugs in recipe sub-components)"
            echo "--- SourcesFileErrors ---"
            mod study . --last-recipe-run --data-table SourcesFileErrors 2>&1 || true
            for csv in .moderne/run/*/datatables/org.openrewrite.table.SourcesFileErrors.csv; do
              [ -f "$csv" ] || continue
              python3 -c "
          import csv, sys
          with open(sys.argv[1]) as f:
              for row in csv.reader(f):
                  print('-------------')
                  print(','.join(row))
          print('-------------')
          " "$csv"
            done
          fi
          run_log=$(grep -oP 'See run log at \K\S+' output_rendered.log || true)
          if [ -n "$run_log" ] && [ -f "$run_log" ]; then
            echo "--- Run Log ($run_log) ---"
            cat "$run_log"
          fi
          if grep -q "Unable to find recipe" output_rendered.log; then
            echo "Recipe not found"
            exit 1
          fi
          EOF
          chmod +x "$BIN_DIR/mod-run"

          echo "$BIN_DIR" >> $GITHUB_PATH

      - name: Install recipe JAR for rewrite-javascript
        shell: bash
        run: mod config recipes jar install org.openrewrite:rewrite-javascript:8.88.0

      - name: Install recipe NPM package for rewrite-angular
        shell: bash
        run: mod config recipes npm install @openrewrite/recipes-angular@1.7.0

      - name: Build LST
        shell: bash
        run: mod build . --no-download

      - name: Run UpgradeToAngular21 recipe
        shell: bash
        run: mod-run . --recipe=org.openrewrite.angular.UpgradeToAngular21

      - name: Upload Moderne logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moderne-angular-logs-${{ matrix.os }}
          path: .moderne/
          if-no-files-found: ignore
          include-hidden-files: true
